[package]
name = "stitch-benchmarks"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
stitch = { path = "..", features = ["full"] }
stitch-data = { git = "https://github.com/stitch-rs/stitch-data.git", branch = "dev", features = ["derive"] }
criterion = { version = "0.5.1", default-features = false, features = ["cargo_bench_support"] }
prost = "0.13"
bincode = "1.3"
postcard = { version = "1.0", features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }

[lib]
name = "stitch_benchmarks"
path = "src/lib.rs"

[[bin]]
name = "stitch-scoreboard"
path = "src/main.rs"

[[bench]]
name = "wire_framing"
path = "benches/wire_framing.rs"
harness = false

[[bench]]
name = "cross_codec"
path = "benches/cross_codec.rs"
harness = false

[[bench]]
name = "e2e_pipeline"
path = "benches/e2e_pipeline.rs"
harness = false
